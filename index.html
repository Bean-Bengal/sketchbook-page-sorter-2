<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchbook Page Sorter</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#f6f1e4;margin:0;padding:12px;color:#222}
.wrap{max-width:560px;margin:0 auto}
#banner{padding:8px;border-radius:6px;font-weight:bold;margin-bottom:10px;overflow-wrap:anywhere}
.pass{background:#cfe8c8}.fail{background:#f4c3c3}
textarea{width:100%;height:130px;font:inherit}
button{font:inherit;padding:8px 14px;margin:6px 0}
li{overflow-wrap:anywhere;margin:3px 0}
.bad{color:#a22}
</style></head><body><div class="wrap">
<h1>Sketchbook Page Sorter</h1>
<div id="banner" role="status"></div>
<p>One page per line as <code>YYYY-M-D title</code>.</p>
<textarea id="in" aria-label="Pages">2024-3-5 cat on a wall
2023-12-25 snow titan
2024-2-29 leap day doodle
2024-2-30 impossible page
2023-2-29 not a leap year
2024-1-9 first sketch</textarea><br>
<button id="go">Sort</button>
<h2>Sorted</h2><ol id="ok"></ol>
<h2>Rejected</h2><ul id="no"></ul>
</div>
<script>
function isLeap(y){return (y%4===0)&&(y%100!==0||y%400===0);}
function parseDate(s){
  const m=/^(\d+)-(\d+)-(\d+)$/.exec(String(s).trim());
  if(!m)return null;
  return {y:+m[1],m:+m[2],d:+m[3]};
}
function isValidDate(s){
  const p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  const len=[31,isLeap(p.y)?29:28,31,30,31,30,31,31,30,31,30,31][p.m-1];
  return p.d<=len;
}
function sortPages(lines){
  const ok=[],bad=[];
  for(const line of lines){
    const t=line.trim();if(!t)continue;
    const i=t.search(/\s/);
    const ds=i<0?t:t.slice(0,i), title=i<0?"":t.slice(i+1).trim();
    if(isValidDate(ds)){const p=parseDate(ds);ok.push({p,ds,title});}
    else bad.push(t);
  }
  ok.sort((a,b)=>a.p.y-b.p.y||a.p.m-b.p.m||a.p.d-b.p.d);
  return {ok,bad};
}
function selfTest(){
  const cases=[["2024-02-29",true],["2024-02-30",false],["2024-2-30",false],["2023-2-29",false],
   ["2023-2-28",true],["1900-2-29",false],["2000-2-29",true],["2024-4-31",false],["2024-13-1",false],["2024-0-5",false],["2024-1-0",false],["abc",false]];
  const fails=cases.filter(([s,e])=>isValidDate(s)!==e).map(c=>c[0]);
  const r=sortPages(["2024-2-30 x","2024-10-2 b","2024-2-9 a"]);
  if(r.bad.length!==1||r.ok.map(o=>o.title).join()!=="a,b")fails.push("sort");
  return fails;
}
function render(){
  const r=sortPages(document.getElementById("in").value.split("\n"));
  document.getElementById("ok").innerHTML=r.ok.map(o=>"<li>"+esc(o.ds+" "+o.title)+"</li>").join("");
  document.getElementById("no").innerHTML=r.bad.map(b=>"<li class=bad>"+esc(b)+"</li>").join("");
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
const b=document.getElementById("banner");
try{const f=selfTest();
  b.className=f.length?"fail":"pass";
  b.textContent=f.length?"Self-test FAILED: "+f.join(", "):"Self-test passed: 2024-02-29 valid, 2024-02-30 rejected";
}catch(e){b.className="fail";b.textContent="Self-test error: "+e.message;}
document.getElementById("go").onclick=render;render();
</script></body></html>
